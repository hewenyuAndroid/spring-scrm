server:
  port: 8082
  servlet:
    context-path: /

# 配置数据库连接池信息
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dlyk?useUnicode=true&characterEncoding=utf8&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    hikari:
      # 最大连接数，默认是10
      maximum-pool-size: 30
      # 最小空闲链接，默认是10
      minimum-idle: 30
      # 等待连接池分配连接的最大时长，超过该时长还没有可用的连接则发生超时异常 (ms)
      connection-timeout: 5000
      # 空闲连接的最大时长，空闲多久就被释放回收，设置为0表示不让连接回收
      idle-timeout: 0
      # 一个连接的最大生命时间，超过该时间还没被使用就会被回收掉 (ms) ,最好不要超过 8h
      max-lifetime: 18000000

  # 配置 redis 的连接信息 (这里redis还没有安装)
  data:
    redis:
      host: 0.0.0.0
      port: 0000
      password: 123456
      database: 0

# 配置 mapper.xml 文件的位置
mybatis:
  mapper-locations: classpath:mapper/*.xml


